# prepmyjob.fr et www.prepmyjob.fr : redirection permanente vers https://prepmyjob.com, chemin et paramètres conservés.
# Installé par deploy/redirect-fr.sh. Certbot ajoute lui-même le HTTPS (443) dans ce bloc, sans redirection
# supplémentaire (option --no-redirect) : http://prepmyjob.fr/prix va directement à https://prepmyjob.com/prix.
# La redirection est dans "location /" (et non au niveau server) pour laisser passer la vérification de certbot.

server {
    listen 80;
    listen [::]:80;
    server_name prepmyjob.fr www.prepmyjob.fr;

    location / {
        return 301 https://prepmyjob.com$request_uri;
    }
}
