# PrepMyJob — pages statiques servies par nginx, /api/ transmis au relais Node (127.0.0.1:5100).
# Certbot ajoute lui-même le HTTPS (443) et la redirection HTTP -> HTTPS (voir deploy/update-nginx.sh pour réappliquer).
# NB : les en-têtes de sécurité sont déclarés UNE SEULE FOIS au niveau du bloc server. Dans nginx, un add_header placé
# dans un bloc location annule ceux du bloc server : on n'en met donc jamais dans les location (cache via "expires").

server {
    listen 80;
    listen [::]:80;
    server_name prepmyjob.com www.prepmyjob.com;

    root /var/www/prepmyjob/public;
    index index.html;

    # www -> domaine sans www
    if ($host = www.prepmyjob.com) { return 301 https://prepmyjob.com$request_uri; }

    client_max_body_size 9m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Relais IA (jamais mis en cache)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Le service worker doit toujours être revalidé
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # Fichiers statiques peu changeants
    location ~* \.(css|svg|png|ico|webp)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Pages "propres" (sans .html) ; une page inconnue renvoie une vraie 404
    location / {
        expires 5m;
        try_files $uri $uri.html $uri/index.html =404;
    }
}

# Ancien domaine .fr -> .com
server {
    listen 80;
    listen [::]:80;
    server_name prepmyjob.fr www.prepmyjob.fr;
    return 301 https://prepmyjob.com$request_uri;
}
