# PrepMyJob — pages statiques servies par nginx, /api/ transmis au relais Node (127.0.0.1:5100).
# Certbot ajoutera lui-même le HTTPS (443) et la redirection HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name prepmyjob.com www.prepmyjob.com;

    root /var/www/prepmyjob/public;
    index index.html;

    # www -> domaine sans www
    if ($host = www.prepmyjob.com) { return 301 https://prepmyjob.com$request_uri; }

    client_max_body_size 9m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Relais IA (jamais mis en cache)
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Le service worker doit toujours être revalidé
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Pages "propres" (sans .html), comme sur Vercel ; une page inconnue renvoie une vraie 404
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri.html $uri/index.html =404;
    }
}

# Ancien domaine .fr -> .com
server {
    listen 80;
    listen [::]:80;
    server_name prepmyjob.fr www.prepmyjob.fr;
    return 301 https://prepmyjob.com$request_uri;
}
